<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise ❤️</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #heart {
    display: none;
    font-size: 35vw;
    line-height: 1;
    animation: pop 0.8s ease-out, glow 1.5s ease-in-out infinite alternate;
    user-select: none;
  }

  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes glow {
    from { filter: drop-shadow(0 0 8px #f00); }
    to { filter: drop-shadow(0 0 35px #f00); }
  }
</style>
</head>
<body>
  <div id="heart">❤️</div>

<script>
  setTimeout(() => {
    document.getElementById("heart").style.display = "block";
  }, 5000);
</script>
</body>
</html>
